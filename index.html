<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaCore | 个人主页</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 50%, #020617 100%);
        color: var(--text);
      }
      .card {
        width: min(720px, 92vw);
        background: linear-gradient(160deg, rgba(17,24,39,.9), rgba(15,23,42,.85));
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 18px;
        padding: 2.2rem;
        box-shadow: 0 16px 50px rgba(2, 6, 23, 0.55);
      }
      h1 {
        margin: 0 0 .8rem;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      p { margin: .6rem 0; line-height: 1.8; }
      .tag {
        display: inline-block;
        margin-right: .6rem;
        margin-top: .6rem;
        padding: .28rem .75rem;
        border-radius: 999px;
        border: 1px solid rgba(148,163,184,.35);
        color: var(--muted);
        font-size: .92rem;
      }
      .accent { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>你好，我是 <span class="accent">NexaCore</span></h1>
      <p>火堆外的夜，虚无主义，机器人爱好者，大学生。</p>
      <p>欢迎来到我的网页，这里会记录我对技术、机器人与未来的思考。</p>
      <section>
        <span class="tag">🤖 机器人</span>
        <span class="tag">🎓 大学生</span>
        <span class="tag">🌌 思考者</span>
      </section>
    </main>
  </body>
</html>
